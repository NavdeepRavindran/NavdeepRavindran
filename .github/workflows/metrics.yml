# Optional — full metrics dashboard. Requires a METRICS_TOKEN secret (Personal
# Access Token with read:user scope). Safe to delete this file if you don't
# want the extra dashboard; nothing else in the README depends on it.
# Full reference: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics

on:
  schedule: [{ cron: "0 * * * *" }] # updates hourly
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_theme: dark_high_contrast
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_habits: yes
